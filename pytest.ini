[pytest]
testpaths = tests betsson
# Sin traza ni vídeo por defecto: con la sesión de Betsson iniciada guardan cookies y el perfil del
# cliente (dirección, documento, KYC). Para depurar SIN sesión: --tracing retain-on-failure --video retain-on-failure.
addopts =
    -ra
    --browser chromium
    --screenshot only-on-failure
    --output outputs/playwright
markers =
    real: entra en Betsson con una cuenta de prueba (solo en el runner propio en España)
    unit: sin red ni navegador (OCR sobre capturas, parse_money, contratos)
    browser: usa navegador, pero sin red externa (página local con route); p. ej. la regresión de la traza sin credenciales
    slow: lento (minutos), p. ej. OCR sobre capturas alteradas; en los PR se salta y corre en push a main y a mano
