name: Validación de juegos

on:
  workflow_dispatch:
    inputs:
      markets:
        description: "Mercados a ejecutar en real, separados por comas (es, com, pe)"
        default: "es"
      game_slug:
        description: "Slug del juego en Betsson (vacío = variable del repo GAME_SLUG)"
        default: ""
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Tests sin red (OCR, parse_money, contratos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # En los PR se saltan los lentos (marca slow) para tener respuesta rápida; en main y a mano, todos.
      - run: pytest -m "${{ github.event_name == 'pull_request' && 'unit and not slow' || 'unit' }}"

  real:
    name: Real · ${{ matrix.market }}
    needs: unit
    # Solo a mano (Actions → Run workflow). Nunca con pull_request: el runner es el portátil del equipo
    # y un PR ejecutaría código ajeno con los secretos. Tampoco en cada push: abriría Chrome en la máquina
    # donde trabajan A y B y gastaría saldo de las cuentas de prueba.
    if: github.event_name == 'workflow_dispatch'
    # Runner propio en España: los runners de GitHub tienen IP de EE. UU. y Betsson geobloquea.
    runs-on: [self-hosted, windows, betsson-es]
    timeout-minutes: 30
    # Una sola ejecución real a la vez por mercado: compartimos cuentas de prueba.
    concurrency:
      group: validacion-real-${{ matrix.market }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - market: es
            secret_prefix: ES
          - market: com
            secret_prefix: COM
          - market: pe
            secret_prefix: PE
    env:
      MARKET: ${{ matrix.market }}
      # Juego a validar (lo lee el test real de C; si falta, el test se salta con motivo).
      GAME_SLUG: ${{ github.event.inputs.game_slug || vars.GAME_SLUG }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      # Activo solo si está en la lista (sin espacios: "es,com"); el input vale "es" por defecto.
      # "ninguno" = ningún mercado (vacío no vale: GitHub lo cambia por el valor por defecto).
      # Sirve para probar el despliegue sin abrir Chrome ni gastar saldo.
      # com y pe: configurados, sin cuenta.
      ENABLED: ${{ contains(format(',{0},', github.event.inputs.markets), format(',{0},', matrix.market)) }}
      VENV_PY: ${{ vars.VENV_PY || 'D:\MAIKI\Malackathon\.venv\Scripts\python.exe' }}
      PLAYWRIGHT_BROWSERS_PATH: D:\DevCache\ms-playwright
    steps:
      - name: Mercado desactivado
        if: env.ENABLED != 'true'
        shell: powershell
        run: Write-Output "Mercado $env:MARKET configurado; ejecución real desactivada (sin cuenta)."

      - name: Comprobar que el runner tiene escritorio
        # --headed necesita una sesión interactiva: el runner se arranca con run.cmd en una terminal, no como servicio.
        if: env.ENABLED == 'true'
        shell: powershell
        run: |
          if ((Get-Process -Id $PID).SessionId -eq 0) {
            Write-Output "::error::El runner corre como servicio (sesión 0, sin escritorio). Arráncalo con run.cmd en una terminal."
            exit 1
          }

      - uses: actions/checkout@v4
        if: env.ENABLED == 'true'
        with:
          clean: true
          persist-credentials: false

      - name: Limpiar evidencias de ejecuciones anteriores
        if: env.ENABLED == 'true'
        shell: powershell
        run: |
          Remove-Item -Recurse -Force outputs -ErrorAction SilentlyContinue
          exit 0

      - name: Comprobar el login asistido (Chrome con sesión abierta)
        # Login asistido autorizado por el mentor: una persona inicia sesión en Chrome (perfiles en
        # D:\MAIKI\Malackathon\.chrome-profiles) y el comprobador se conecta por CDP. El runner debe
        # correr con el mismo usuario de Windows que ese Chrome para llegar a 127.0.0.1.
        if: env.ENABLED == 'true'
        shell: powershell
        env:
          CDP_PORTS: ${{ vars.CDP_PORTS || '9222,9223' }}
        run: |
          $fallan = @()
          foreach ($p in $env:CDP_PORTS.Split(',')) {
            try { Invoke-RestMethod -Uri "http://127.0.0.1:$($p.Trim())/json/version" -TimeoutSec 5 | Out-Null }
            catch { $fallan += $p.Trim() }
          }
          if ($fallan.Count -gt 0) {
            Write-Output "::error::Chrome no responde en los puertos CDP $($fallan -join ', '): repetir login asistido."
            exit 1
          }
          Write-Output "Login asistido disponible en los puertos $env:CDP_PORTS."

      - name: Ejecutar escenarios
        if: env.ENABLED == 'true'
        shell: powershell
        # Los secretos solo existen en este paso y en el escáner. Se exponen con el nombre de .env.example.
        env:
          BETSSON_USERNAME: ${{ secrets[format('BETSSON_{0}_USERNAME', matrix.secret_prefix)] }}
          BETSSON_PASSWORD: ${{ secrets[format('BETSSON_{0}_PASSWORD', matrix.secret_prefix)] }}
          BETSSON_EMPTY_USERNAME: ${{ secrets[format('BETSSON_{0}_EMPTY_USERNAME', matrix.secret_prefix)] }}
          BETSSON_EMPTY_PASSWORD: ${{ secrets[format('BETSSON_{0}_EMPTY_PASSWORD', matrix.secret_prefix)] }}
        run: |
          $m = $env:MARKET.ToUpper()
          foreach ($k in 'USERNAME','PASSWORD','EMPTY_USERNAME','EMPTY_PASSWORD') {
            [Environment]::SetEnvironmentVariable("BETSSON_${m}_$k", [Environment]::GetEnvironmentVariable("BETSSON_$k"))
          }
          # Sin traza, vídeo ni capturas automáticas de pytest-playwright: con la sesión iniciada la traza
          # guarda el perfil del cliente (GET /api/v2/es/currentcustomer: dirección, documento, KYC).
          # Anulan las opciones de pytest.ini (la línea de comandos manda).
          & $env:VENV_PY -m pytest -m "(unit and not slow) or real or browser" --market $env:MARKET --headed --browser-channel chrome --tracing off --video off --screenshot off
          exit $LASTEXITCODE

      - name: Buscar secretos en las evidencias
        id: scan
        if: always() && env.ENABLED == 'true'
        shell: powershell
        env:
          BETSSON_USERNAME: ${{ secrets[format('BETSSON_{0}_USERNAME', matrix.secret_prefix)] }}
          BETSSON_PASSWORD: ${{ secrets[format('BETSSON_{0}_PASSWORD', matrix.secret_prefix)] }}
          BETSSON_EMPTY_USERNAME: ${{ secrets[format('BETSSON_{0}_EMPTY_USERNAME', matrix.secret_prefix)] }}
          BETSSON_EMPTY_PASSWORD: ${{ secrets[format('BETSSON_{0}_EMPTY_PASSWORD', matrix.secret_prefix)] }}
        run: |
          & $env:VENV_PY .github/scripts/scan_secrets.py outputs
          exit $LASTEXITCODE

      - name: Publicar evidencias e informe
        # Solo si el escáner terminó en verde. Trazas (.zip) y vídeos (.webm) nunca se publican:
        # con la sesión iniciada guardan cookies y datos personales del cliente, que el escáner no reconoce.
        if: always() && env.ENABLED == 'true' && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-${{ matrix.market }}-${{ env.RUN_ID }}
          path: |
            outputs/
            !outputs/**/*.zip
            !outputs/**/*.webm
          if-no-files-found: warn
          retention-days: 7

      - name: Borrar trazas y vídeos del runner
        # Tampoco se guardan en el portátil: pueden llevar cookies y datos personales del cliente.
        if: always() && env.ENABLED == 'true'
        shell: powershell
        run: |
          Get-ChildItem outputs -Recurse -Include *.zip,*.webm,*.har -ErrorAction SilentlyContinue | Remove-Item -Force
          exit 0

  pages:
    name: Informe web (artifact y GitHub Pages)
    needs: real
    # Solo tras una ejecución a mano. Usa únicamente los artifacts "evidencias-*", que solo existen
    # si el escáner de secretos salió en verde. Corre en GitHub: no necesita secretos ni el portátil.
    if: always() && github.event_name == 'workflow_dispatch' && needs.real.result != 'skipped' && needs.real.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Descargar las evidencias escaneadas
        uses: actions/download-artifact@v4
        with:
          pattern: evidencias-*
          path: evidencias

      - name: Construir la web del informe
        env:
          MARKETS: ${{ github.event.inputs.markets }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python .github/scripts/build_pages.py evidencias site

      - name: Publicar la web como artifact
        uses: actions/upload-artifact@v4
        with:
          name: informe-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/
          retention-days: 7

      # GitHub Pages: el plan actual no lo permite en un repo privado (HTTP 422).
      # Se activa con la variable del repo PAGES_ENABLED=true cuando Pages esté disponible
      # (Settings → Pages → Source: GitHub Actions). Ojo: la web de Pages es pública.
      - name: Preparar Pages
        if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Desplegar en Pages
        if: vars.PAGES_ENABLED == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
